<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#161719" />
  <title>SIL Insurance — Yearbook 2026</title>
  <meta name="description" content="SIL Insurance Yearbook 2026 interactive flipbook" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">SIL Insurance <span>Yearbook 2026</span></div>
      <button class="icon-btn" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg>
      </button>
    </header>

    <section class="viewer-shell" id="viewerShell" aria-label="Yearbook flipbook viewer">
      <button class="page-arrow page-arrow-left" id="prevBtn" type="button" aria-label="Previous page" title="Previous page">
        <svg viewBox="0 0 72 56" aria-hidden="true"><path d="M59 42C52 29 41 23 24 24M24 24l11-11M24 24l12 10"/></svg>
      </button>

      <div class="book-stage" id="bookStage">
        <div class="book-wrap" id="bookWrap">
          <div id="flipbook" class="flipbook"></div>
          <div class="center-crease" aria-hidden="true"></div>
        </div>
      </div>

      <button class="page-arrow page-arrow-right" id="nextBtn" type="button" aria-label="Next page" title="Next page">
        <svg viewBox="0 0 72 56" aria-hidden="true"><path d="M13 42C20 29 31 23 48 24M48 24L37 13M48 24L36 34"/></svg>
      </button>
    </section>

    <section class="toolbar" aria-label="Flipbook controls">
      <button class="tool-btn" id="thumbBtn" type="button" aria-expanded="false" aria-controls="thumbPanel">
        <span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Thumbnails</span>
      </button>

      <div class="toolbar-center">
        <button class="icon-btn small" id="zoomOutBtn" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="page-indicator" id="pageIndicator" type="button" aria-label="Current pages">1 / 43</button>
        <button class="icon-btn small" id="zoomInBtn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button class="icon-btn small" id="fitBtn" type="button" aria-label="Fit to screen" title="Fit to screen">↺</button>
      </div>

      <a class="tool-btn download-btn" href="Yearbook-2026.pdf" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        <span>Download PDF</span>
      </a>
    </section>

    <section class="thumb-panel" id="thumbPanel" hidden aria-label="Page thumbnails">
      <div class="thumb-strip" id="thumbStrip"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
