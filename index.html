<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1526" />
  <title>SIL Insurance — Yearbook 2026</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <a class="brand" href="https://silinsurance.am" aria-label="SIL Insurance home">
        <span class="brand-sil">Sil</span><span class="brand-insurance">insurance</span>
      </a>
      <div class="title-wrap">
        <div class="doc-title">Yearbook 2026</div>
        <div class="page-indicator" id="pageIndicator">1 / 43</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="thumbsBtn" aria-label="Thumbnails" title="Thumbnails">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        </button>
        <button class="icon-btn" id="fullscreenBtn" aria-label="Fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <a class="icon-btn" href="yearbook.pdf" download aria-label="Download PDF" title="Download PDF">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </header>

    <aside class="thumbs-panel" id="thumbsPanel" aria-hidden="true">
      <div class="thumbs-head">
        <strong>Pages</strong>
        <button class="close-btn" id="closeThumbs" aria-label="Close">×</button>
      </div>
      <div class="thumbs-grid" id="thumbsGrid"></div>
    </aside>

    <section class="viewer-shell">
      <button class="nav nav-left" id="prevBtn" aria-label="Previous page" title="Previous page">
        <svg class="turn-arrow" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M38 34C34 23 26 17 11 17M11 17L19 9M11 17L20 25" />
        </svg>
      </button>
      <div class="book-stage" id="bookStage">
        <div id="book" class="book"></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span>Loading yearbook…</span>
        </div>
      </div>
      <button class="nav nav-right" id="nextBtn" aria-label="Next page" title="Next page">
        <svg class="turn-arrow" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 34C14 23 22 17 37 17M37 17L29 9M37 17L28 25" />
        </svg>
      </button>
    </section>

    <footer class="toolbar">
      <button class="tool-btn" id="prevBottom" aria-label="Previous">‹</button>
      <input id="pageSlider" class="page-slider" type="range" min="1" max="43" value="1" aria-label="Page" />
      <button class="tool-btn" id="nextBottom" aria-label="Next">›</button>
      <div class="toolbar-separator"></div>
      <button class="tool-btn zoom" id="zoomOut" aria-label="Zoom out">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="tool-btn zoom" id="zoomIn" aria-label="Zoom in">+</button>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
